<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AI Output Quality Evaluation Dashboard</title>
<style>
:root{--bg:#f6f7fb;--sf:#fff;--sf2:#f0f1f8;--tx:#14162b;--mu:#6b7090;--bd:#e5e7f0;--ac:#4f46e5;--ac2:#8b5cf6;--c0:#16a34a;--c1:#2563eb;--c2:#d97706;--c3:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f1a;--sf:#171829;--sf2:#202238;--tx:#eceefb;--mu:#9a9fc2;--bd:#292b45;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:flex;min-height:100vh}
aside{width:224px;background:var(--sf);border-right:1px solid var(--bd);padding:16px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{font-weight:700;font-size:15px;padding:4px 10px 16px;display:flex;gap:8px;align-items:center}.logo i{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--ac),var(--ac2))}
nav button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--mu);padding:9px 10px;border-radius:8px;font:inherit;cursor:pointer}
nav button:hover{background:var(--sf2)}nav button.on{background:var(--sf2);color:var(--ac);font-weight:600}
main{flex:1;min-width:0;padding:24px;max-width:1200px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0 0 12px}.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(20,22,43,.05)}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:2fr 1fr}
.kpi b{font-size:28px;display:block;margin-top:6px}.kpi .ic{float:right;width:32px;height:32px;border-radius:9px;background:var(--sf2);display:grid;place-items:center;color:var(--ac)}
.up{color:var(--c0)}.dn{color:var(--c3)}.mu{color:var(--mu)}.sm{font-size:12px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.s0{background:var(--c0)}.s1{background:var(--c1)}.s2{background:var(--c2)}.s3{background:var(--c3)}
label{display:block;font-weight:600;margin:12px 0 4px}input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:110px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
.btn{border:0;border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.btn.sec{background:var(--sf2);color:var(--tx)}.btn.sm{padding:4px 9px;font-size:12px}.btn:disabled{opacity:.6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}
.bar{height:8px;border-radius:9px;background:var(--sf2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;font-weight:600}
tr[onclick]:hover td{background:var(--sf2)}.err{color:var(--c3);font-size:12px;margin-top:4px}.banner{background:var(--sf2);border-left:3px solid var(--c2);padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:9px;z-index:30}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20;padding:16px}.modal .card{width:min(640px,100%)}
ul{margin:4px 0;padding-left:18px}.pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:9px;border:1px solid var(--bd);max-height:220px;overflow:auto}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
@media(max-width:700px){.app{flex-direction:column}aside{width:100%;height:auto;position:static;border:0;border-bottom:1px solid var(--bd);padding:8px}nav{display:flex;overflow-x:auto;gap:4px}nav button{white-space:nowrap;width:auto}.logo{padding-bottom:6px}main{padding:14px}}
@media print{aside,.noprint{display:none!important}.app{display:block}}
</style></head><body><div class="app"><aside><div class="logo" style="cursor:pointer" onclick="nav('overview')" title="Overview"><svg width="34" height="34" viewBox="0 0 32 32" role="img" aria-label="EvalDash logo"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--ac)"/><stop offset="1" style="stop-color:var(--ac2)"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg)"/><polygon points="16,5.5 26.5,16 16,26.5 5.5,16" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.5"/><polygon points="16,10 22,16 16,22 10,16" fill="#fff" fill-opacity=".18"/><path d="M11.6 16.4l3 3 5.8-6.6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><div style="line-height:1.15">EvalDash<div class="sm mu" style="font-weight:500">AI Quality</div></div></div><nav id="nav"></nav></aside><main id="main"></main></div><div id="ov"></div>
<script>
const DIM=['relevance','completeness','clarity','factual'],LBL={relevance:'Relevance',completeness:'Completeness',clarity:'Clarity',factual:'Factual Support'};
const NAV=[['overview','▦','Overview'],['new','＋','New Evaluation'],['history','☰','Evaluation History'],['analytics','◔','Analytics'],['compare','⇄','Compare Responses'],['reports','⎙','Reports'],['settings','⚙','Settings']];
const ST=[['Excellent','s0','var(--c0)'],['Good','s1','var(--c1)'],['Average','s2','var(--c2)'],['Needs Improvement','s3','var(--c3)']];
const D=864e5,esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cl=(n,a=0,b=10)=>Math.max(a,Math.min(b,Math.round(n)));
const stIdx=p=>p>=90?0:p>=75?1:p>=60?2:3,pct=e=>Math.round(DIM.reduce((s,k)=>s+e.scores[k],0)/4*10);
const badge=p=>{const s=ST[stIdx(p)];return `<span class="badge ${s[1]}">${s[0]}</span>`};
const fd=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
let S={view:'overview',id:null,edit:null,range:30,q:'',fs:'all',fr:'all',ca:null,cb:null,res:null},DB=[];
function seed(){let r=7;const rnd=()=>(r=(r*16807)%2147483647)/2147483647,names=['Refund policy answer','Python sorting explainer','Travel itinerary draft','Medical FAQ summary','SQL query helper','Product description','Legal clause summary','Onboarding email','Climate Q&A','Tax deadline reply'];
return Array.from({length:30},(_,i)=>{const b=5.5+rnd()*3.5+i/30,sc={};DIM.forEach(k=>sc[k]=cl(b+(rnd()-.5)*3+(k=='factual'?-.8:0)));
return{id:'EV-'+(1001+i),name:names[i%10]+' #'+(i+1),ts:Date.now()-(89-i*3)*D+rnd()*D,prompt:'Sample prompt',response:'Sample response (seed data)',expected:'',sources:'',scores:sc,mode:'sample',...texts(sc,false)}})}
function texts(sc,hasSrc){const why={relevance:['The response barely addresses the query.','Partly on topic but drifts from the question.','Mostly aligned with the question.','Directly addresses the query and stays on topic.'],completeness:['Major parts of the request are missing.','Several requested details are absent.','Most points covered; some detail missing.','Covers all key aspects of the request.'],clarity:['Hard to follow; structure is weak.','Readable but sentences or structure need work.','Well organised and easy to read.','Very clear, concise and well structured.'],factual:['Claims are unverified and unsupported by references.','Limited support; several claims need sources.','Mostly plausible; some claims need references.','Claims align with the supplied reference material.']};
const w={},st=[],wk=[],rec=[];DIM.forEach(k=>{const v=sc[k];w[k]=why[k][v<4?0:v<6?1:v<8?2:3];(v>=8?st:v<6?wk:[]).push(LBL[k]+' ('+v+'/10): '+w[k]);});
if(sc.factual<8)rec.push('Add supporting references and verify key claims.');if(sc.completeness<8)rec.push('Cover the missing details from the request.');if(sc.clarity<8)rec.push('Use shorter sentences and a clearer structure.');if(sc.relevance<8)rec.push('Tighten the answer to the question asked.');
return{why:w,strengths:st.length?st:['No dimension scored 8 or above.'],weaknesses:wk.length?wk:['No dimension scored below 6.'],recs:rec.length?rec:['Keep this standard; consider adding citations for extra assurance.']}}
const tok=s=>new Set((s.toLowerCase().match(/[a-z0-9]{4,}/g)||[]));
const ov=(a,b)=>{const A=tok(a),B=tok(b);if(!A.size)return 0;let n=0;A.forEach(x=>B.has(x)&&n++);return n/A.size};
function score(p,r,x,s){const wc=(r.match(/\S+/g)||[]).length,sents=r.split(/[.!?]+\s/).filter(Boolean),avg=wc/Math.max(1,sents.length),base=Math.min(1,wc/120),sc={};
sc.relevance=cl(2+ov(p,r)*11);sc.completeness=cl(2+(x?ov(x,r)*.6+base*.4:base)*8);
sc.clarity=cl(9-(avg>28?(avg-28)/3:0)-(avg<6?2:0)-(wc<25?2:0)+(/\n|^\s*[-*\d]/m.test(r)?1:0));
const n=(s.match(/https?:\/\/|\n/g)||[]).length+(s.trim()?1:0);
sc.factual=s.trim()?cl(5+Math.min(3,n)+ov(s,r)*2):x?cl(3+ov(x,r)*4):3;
return sc}
function load(){try{const v=localStorage.getItem('aiq1');if(v)return JSON.parse(v)}catch(e){}return null}
function save(){try{localStorage.setItem('aiq1',JSON.stringify(DB))}catch(e){}}
DB=load()||seed();
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function modal(h){$ov.innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="card">${h}</div></div>`}
function closeM(){$ov.innerHTML=''}
const $ov=document.getElementById('ov');
const csvRows=l=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';return [['ID','Name','Date','Relevance','Completeness','Clarity','Factual Support','Overall %','Status'].join(',')].concat(l.map(e=>[e.id,q(e.name),new Date(e.ts).toISOString().slice(0,10),...DIM.map(k=>e.scores[k]),pct(e),ST[stIdx(pct(e))][0]].join(','))).join('\n')};
function csvModal(l){const c=csvRows(l);modal(`<h2>CSV export</h2><p class="mu sm">Downloads are not available in a hosted page, so copy the CSV and paste it into a .csv file.</p><textarea id="csvt" readonly>${esc(c)}</textarea><div class="row" style="margin-top:12px"><button class="btn" onclick="copyCsv()">Copy to clipboard</button><button class="btn sec" onclick="closeM()">Close</button></div>`)}
function copyCsv(){const t=document.getElementById('csvt');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Copied'),()=>{document.execCommand('copy');toast('Copied')})}catch(e){document.execCommand('copy');toast('Copied')}}
/* charts */
const W=460,H=200;
function line(vals,labels,col='var(--ac)'){if(!vals.length)return'<p class="mu">No data in this range.</p>';const mx=Math.max(10,...vals),pts=vals.map((v,i)=>[30+i*(W-45)/Math.max(1,vals.length-1),H-25-(v/mx)*(H-45)]);
return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${[0,.5,1].map(f=>`<line x1="30" x2="${W-10}" y1="${H-25-f*(H-45)}" y2="${H-25-f*(H-45)}" stroke="var(--bd)"/><text x="2" y="${H-21-f*(H-45)}" font-size="10" fill="var(--mu)">${Math.round(f*mx)}</text>`).join('')}<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${col}"><title>${labels[i]}: ${vals[i]}</title></circle>`).join('')}${labels.map((l,i)=>i%Math.ceil(labels.length/6)?'':`<text x="${pts[i][0]}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mu)">${l}</text>`).join('')}</svg>`}
function bars(vals,labels,cols){const mx=Math.max(1,...vals),bw=(W-40)/vals.length;
return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><line x1="30" x2="${W-10}" y1="${H-25}" y2="${H-25}" stroke="var(--bd)"/>${vals.map((v,i)=>{const h=v/mx*(H-55);return `<rect x="${32+i*bw+6}" y="${H-25-h}" width="${bw-12}" height="${h}" rx="5" fill="${cols?cols[i]:'var(--ac)'}"><title>${labels[i]}: ${v}</title></rect><text x="${32+i*bw+bw/2}" y="${H-28-h}" font-size="11" text-anchor="middle" fill="var(--tx)">${v}</text><text x="${32+i*bw+bw/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mu)">${labels[i]}</text>`}).join('')}</svg>`}
function donut(vals){const t=vals.reduce((a,b)=>a+b,0)||1;let o=0;return `<div class="row"><svg viewBox="0 0 100 100" width="150" role="img" style="transform:rotate(-90deg)">${vals.map((v,i)=>{const l=v/t*251.3,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${ST[i][2]}" stroke-width="16" stroke-dasharray="${l} ${251.3-l}" stroke-dashoffset="${-o}"><title>${ST[i][0]}: ${v}</title></circle>`;o+=l;return s}).join('')}</svg><div>${ST.map((s,i)=>`<div class="sm"><span style="color:${s[2]}">●</span> ${s[0]}: <b>${vals[i]}</b></div>`).join('')}</div></div>`}
function radar(series){const c=110,R=80,pt=(i,v)=>[c+Math.cos(i*Math.PI/2-Math.PI/2)*R*v/10,c+Math.sin(i*Math.PI/2-Math.PI/2)*R*v/10],cols=['var(--ac)','var(--c2)'];
return `<svg viewBox="0 0 220 220" width="100%" style="max-width:280px" role="img">${[2.5,5,7.5,10].map(r=>`<polygon fill="none" stroke="var(--bd)" points="${[0,1,2,3].map(i=>pt(i,r).join(',')).join(' ')}"/>`).join('')}${DIM.map((k,i)=>{const p=pt(i,11.8);return `<text x="${p[0]}" y="${p[1]+3}" font-size="9" text-anchor="middle" fill="var(--mu)">${LBL[k]}</text>`}).join('')}${series.map((s,j)=>`<polygon fill="${cols[j]}" fill-opacity=".2" stroke="${cols[j]}" stroke-width="2" points="${s.map((v,i)=>pt(i,v).join(',')).join(' ')}"/>`).join('')}</svg>`}
const avg=(l,k)=>l.length?+(l.reduce((s,e)=>s+e.scores[k],0)/l.length).toFixed(1):0;
const inR=n=>DB.filter(e=>n==0||e.ts>=Date.now()-n*D);
const rangeSel=()=>`<select style="width:auto" onchange="S.range=+this.value;go()">${[[7,'Last 7 days'],[30,'Last 30 days'],[90,'Last 90 days'],[0,'All time']].map(r=>`<option value="${r[0]}" ${S.range==r[0]?'selected':''}>${r[1]}</option>`).join('')}</select>`;
/* views */
const V={};
V.overview=()=>{const cur=DB.filter(e=>e.ts>=Date.now()-30*D),prv=DB.filter(e=>e.ts<Date.now()-30*D&&e.ts>=Date.now()-60*D);
const m=l=>({n:l.length,a:l.length?Math.round(l.reduce((s,e)=>s+pct(e),0)/l.length):0,x:l.length?Math.round(l.filter(e=>pct(e)>=90).length/l.length*100):0,i:l.length?Math.round(l.filter(e=>pct(e)<60).length/l.length*100):0}),c=m(cur),p=m(prv);
const k=(t,v,pv,ic,sfx,inv)=>{const d=pv?Math.round((v-pv)/pv*100):0,good=inv?d<=0:d>=0;return `<div class="card kpi"><span class="ic">${ic}</span><span class="mu">${t}</span><b>${v}${sfx}</b><span class="sm ${good?'up':'dn'}">${d>=0?'▲':'▼'} ${Math.abs(d)}%</span> <span class="sm mu">vs previous 30 days</span></div>`};
const wk={};DB.filter(e=>e.ts>=Date.now()-84*D).forEach(e=>{const b=Math.floor((Date.now()-e.ts)/(7*D));(wk[b]=wk[b]||[]).push(pct(e))});const ks=Object.keys(wk).map(Number).sort((a,b)=>b-a);
return `<h1>Overview</h1><p class="sub">Quality of AI responses over the last 30 days.</p><div class="grid g4">${k('Total Evaluations',c.n,p.n,'#','',0)}${k('Average Quality Score',c.a,p.a,'★','',0)}${k('Excellent Responses',c.x,p.x,'✓','%',0)}${k('Needs Improvement',c.i,p.i,'!','%',1)}</div>
<div class="grid g3" style="margin-top:14px"><div class="card"><h2>Weekly average quality (%)</h2>${line(ks.map(b=>Math.round(wk[b].reduce((a,x)=>a+x,0)/wk[b].length)).map(v=>v/10),ks.map(b=>b?b+'w ago':'now'))}<p class="sm mu">Axis shows score out of 10 (×10 = %).</p></div><div class="card"><h2>Status mix (all time)</h2>${donut(ST.map((s,i)=>DB.filter(e=>stIdx(pct(e))==i).length))}</div></div>
${recentPanel()}`};
function recentPanel(){const rec=DB.slice().sort((a,b)=>b.ts-a.ts).slice(0,10);if(!rec.length)return '<div class="card" style="margin-top:14px"><p class="mu">No evaluations yet. Start with New Evaluation.</p></div>';const e=rec.find(x=>x.id==S.ov)||rec[0],p=pct(e);
return `<div class="card" style="margin-top:14px"><div class="row sp"><h2>Recent evaluations</h2><button class="btn sm sec" onclick="nav('history')">View all</button></div><label style="margin-top:0">Select an evaluation to see its results</label><select onchange="S.ov=this.value;go()">${rec.map(x=>`<option value="${x.id}" ${x.id==e.id?'selected':''}>${x.id} · ${esc(x.name)} · ${pct(x)}/100 · ${fd(x.ts)}</option>`).join('')}</select></div>
<div class="row sp" style="margin-top:14px"><div><h2 style="margin:0">${esc(e.name)}</h2><span class="sm mu">${e.id} · ${fd(e.ts)} · ${e.mode=='demo'?'Demo-mode scoring':'Sample data'}</span></div><button class="btn sm sec" onclick="S.id='${e.id}';nav('detail')">Open full report</button></div>
<div class="grid g2" style="margin-top:10px"><div class="card"><h2>Overall Quality Score</h2><div style="font-size:40px;font-weight:700">${p}<span class="mu" style="font-size:18px">/100</span></div>${badge(p)}<div style="margin-top:12px">${DIM.map(k=>`<div style="margin:10px 0"><div class="row sp"><span>${LBL[k]}</span><b>${e.scores[k]}/10</b></div><div class="bar"><i style="width:${e.scores[k]*10}%"></i></div><div class="sm mu">${esc(e.why[k])}</div></div>`).join('')}</div></div><div class="card" style="text-align:center"><h2>Dimension radar</h2>${radar([DIM.map(k=>e.scores[k])])}</div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h2>Strengths</h2><ul>${e.strengths.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><h2 style="margin-top:12px">Weaknesses</h2><ul>${e.weaknesses.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div><div class="card"><h2>Recommendations</h2><ul>${e.recs.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><h2 style="margin-top:12px">Evaluated output</h2><div class="pre">${esc(e.response)}</div></div></div>`}
function table(l,mini){if(!l.length)return'<p class="mu">No evaluations match.</p>';return `<div class="tw"><table><tr><th>ID</th><th>Name</th><th>Date</th><th>Relev.</th><th>Compl.</th><th>Clarity</th><th>Factual</th><th>Overall</th><th>Status</th>${mini?'':'<th>Actions</th>'}</tr>${l.map(e=>`<tr style="cursor:pointer" title="Open this evaluation" onclick="S.id='${e.id}';nav('detail')"><td>${e.id}</td><td><b style="color:var(--ac)">${esc(e.name)}</b>${e.mode=='sample'?' <span class="sm mu">(sample)</span>':''}</td><td>${fd(e.ts)}</td>${DIM.map(k=>`<td>${e.scores[k]}</td>`).join('')}<td><b>${pct(e)}</b></td><td>${badge(pct(e))}</td>${mini?'':`<td onclick="event.stopPropagation()"><button class="btn sm sec" onclick="S.id='${e.id}';nav('detail')">View</button> <button class="btn sm sec" onclick="S.edit='${e.id}';nav('new')">Edit</button> <button class="btn sm sec" onclick="csvModal([DB.find(x=>x.id=='${e.id}')])">Export</button> <button class="btn sm sec" onclick="del('${e.id}')">Delete</button></td>`}</tr>`).join('')}</table></div>`}
function del(id){modal(`<h2>Delete ${id}?</h2><p class="mu">This cannot be undone.</p><div class="row"><button class="btn" onclick="DB=DB.filter(e=>e.id!='${id}');save();closeM();go();toast('Deleted')">Delete</button><button class="btn sec" onclick="closeM()">Cancel</button></div>`)}
V.history=()=>{const l=DB.filter(e=>(!S.q||(e.name+e.id).toLowerCase().includes(S.q.toLowerCase()))&&(S.fs=='all'||ST[stIdx(pct(e))][0]==S.fs)&&(S.fr=='all'||e.ts>=Date.now()-S.fr*D)).sort((a,b)=>b.ts-a.ts);
return `<h1>Evaluation History</h1><p class="sub">${l.length} of ${DB.length} evaluations.</p><div class="row" style="margin-bottom:12px"><input style="max-width:260px" placeholder="Search name or ID" value="${esc(S.q)}" oninput="S.q=this.value;hl()"><select style="width:auto" onchange="S.fs=this.value;go()"><option value="all">All statuses</option>${ST.map(s=>`<option ${S.fs==s[0]?'selected':''}>${s[0]}</option>`).join('')}</select><select style="width:auto" onchange="S.fr=this.value;go()">${[['all','All time'],[7,'Last 7 days'],[30,'Last 30 days'],[90,'Last 90 days']].map(r=>`<option value="${r[0]}" ${S.fr==r[0]?'selected':''}>${r[1]}</option>`).join('')}</select><button class="btn sec" onclick="csvModal(DB)">Export all CSV</button></div><div class="card" id="ht">${table(l)}</div>`};
function hl(){const l=DB.filter(e=>(!S.q||(e.name+e.id).toLowerCase().includes(S.q.toLowerCase()))&&(S.fs=='all'||ST[stIdx(pct(e))][0]==S.fs)&&(S.fr=='all'||e.ts>=Date.now()-S.fr*D)).sort((a,b)=>b.ts-a.ts);document.getElementById('ht').innerHTML=table(l)}
V.new=()=>{const e=S.edit?DB.find(x=>x.id==S.edit):null;return `<h1>${e?'Edit '+e.id:'New Evaluation'}</h1><p class="sub">Score an AI response on four quality dimensions.</p><div class="banner"><b>Demo evaluation mode.</b> No AI API key is configured, so scores come from a deterministic text heuristic (keyword overlap, length, sentence structure), not a real AI judge. Factual Support stays low unless you supply reference sources or an expected answer, and is never marked “verified”.</div><div class="card" style="max-width:760px"><label>Evaluation Name *</label><input id="f_n" value="${esc(e?.name)}"><div class="err" id="e_n"></div><label>User Prompt / Query *</label><textarea id="f_p">${esc(e?.prompt)}</textarea><div class="err" id="e_p"></div><label>AI-Generated Response *</label><textarea id="f_r">${esc(e?.response)}</textarea><div class="err" id="e_r"></div><label>Expected Answer (optional)</label><textarea id="f_x">${esc(e?.expected)}</textarea><label>Reference Sources (optional)</label><textarea id="f_s" placeholder="Paste source text or URLs, one per line">${esc(e?.sources)}</textarea><div class="row" style="margin-top:16px"><button class="btn" id="go" onclick="evalIt()">Evaluate Response</button>${e?'<button class="btn sec" onclick="S.edit=null;nav(\'history\')">Cancel</button>':''}</div></div>`};
function evalIt(){const g=i=>document.getElementById(i).value.trim(),n=g('f_n'),p=g('f_p'),r=g('f_r');let bad=0;
[['n',n,1,'Name is required'],['p',p,5,'Enter the prompt (min 5 characters)'],['r',r,20,'Response must be at least 20 characters']].forEach(([k,v,m,t])=>{document.getElementById('e_'+k).textContent=v.length<m?t:'';if(v.length<m)bad=1});if(bad)return;
const b=document.getElementById('go');b.disabled=true;b.textContent='Evaluating…';
setTimeout(()=>{try{const x=g('f_x'),s=g('f_s'),sc=score(p,r,x,s),old=S.edit?DB.find(e=>e.id==S.edit):null,e={id:old?old.id:'EV-'+(1001+DB.length+Math.floor(Math.random()*900)),name:n,ts:old?old.ts:Date.now(),prompt:p,response:r,expected:x,sources:s,scores:sc,mode:'demo',...texts(sc,!!s)};
if(!s&&!x)e.why.factual='Unverified: no reference sources or expected answer were supplied, so factual accuracy could not be checked.';
if(old)DB[DB.indexOf(old)]=e;else DB.push(e);save();S.edit=null;S.id=e.id;nav('detail');toast('Evaluation saved')}catch(err){b.disabled=false;b.textContent='Evaluate Response';toast('Error: '+err.message)}},600)}
V.detail=()=>{const e=DB.find(x=>x.id==S.id);if(!e)return'<p>Evaluation not found.</p>';const p=pct(e);
return `<div class="row sp noprint"><div><h1>${esc(e.name)}</h1><p class="sub">${e.id} · ${fd(e.ts)} · ${e.mode=='demo'?'Demo-mode scoring (heuristic, not a real AI judge)':'Sample data'}</p></div><div class="row"><button class="btn sec" onclick="window.print()">Print / Save PDF</button><button class="btn sec" onclick="csvModal([DB.find(x=>x.id=='${e.id}')])">Export CSV</button></div></div>
<div class="grid g2"><div class="card"><h2>Overall Quality Score</h2><div style="font-size:44px;font-weight:700">${p}<span class="mu" style="font-size:18px">/100</span></div>${badge(p)}<div style="margin-top:14px">${DIM.map(k=>`<div style="margin:10px 0"><div class="row sp"><span>${LBL[k]}</span><b>${e.scores[k]}/10</b></div><div class="bar"><i style="width:${e.scores[k]*10}%"></i></div></div>`).join('')}</div></div><div class="card" style="text-align:center"><h2>Dimension radar</h2>${radar([DIM.map(k=>e.scores[k])])}</div></div>
<div class="card" style="margin-top:14px"><h2>Why each score was assigned</h2>${DIM.map(k=>`<p><b>${LBL[k]}: ${e.scores[k]}/10</b><br><span class="mu">${esc(e.why[k])}</span></p>`).join('')}</div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h2>Strengths</h2><ul>${e.strengths.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><h2 style="margin-top:14px">Weaknesses</h2><ul>${e.weaknesses.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div><div class="card"><h2>Recommendations</h2><ul>${e.recs.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>${e.sources?'':'<p class="sm mu">Factual Support is unverified: no reference material was provided.</p>'}</div></div>
<div class="card" style="margin-top:14px"><h2>Prompt</h2><div class="pre">${esc(e.prompt)}</div><h2 style="margin-top:12px">Response</h2><div class="pre">${esc(e.response)}</div></div>`};
V.analytics=()=>{const l=inR(S.range),bk=[0,0,0,0,0];l.forEach(e=>bk[Math.min(4,Math.floor(Math.max(0,pct(e)-50)/10))]++);
const dy={};l.forEach(e=>{const d=new Date(e.ts).toISOString().slice(0,7);(dy[d]=dy[d]||[]).push(e)});const ms=Object.keys(dy).sort(),short=m=>new Date(m+'-15').toLocaleDateString(undefined,{month:'short'});
return `<div class="row sp"><div><h1>Analytics</h1><p class="sub">${l.length} evaluations in range.</p></div>${rangeSel()}</div><div class="grid g2"><div class="card"><h2>Score distribution</h2>${bars(bk,['<60','60s','70s','80s','90+'].map((x,i)=>['≤59','60–69','70–79','80–89','90–100'][i]),['var(--c3)','var(--c2)','var(--c2)','var(--c1)','var(--c0)'])}</div><div class="card"><h2>Average by dimension (out of 10)</h2>${bars(DIM.map(k=>avg(l,k)),DIM.map(k=>LBL[k].split(' ')[0]))}</div><div class="card" style="text-align:center"><h2>Dimension radar</h2>${radar([DIM.map(k=>avg(l,k))])}</div><div class="card"><h2>Status breakdown</h2>${donut(ST.map((s,i)=>l.filter(e=>stIdx(pct(e))==i).length))}</div><div class="card"><h2>Quality trend by month (avg /10)</h2>${line(ms.map(m=>+(dy[m].reduce((s,e)=>s+pct(e),0)/dy[m].length/10).toFixed(1)),ms.map(short))}</div><div class="card"><h2>Evaluation volume by month</h2>${bars(ms.map(m=>dy[m].length),ms.map(short))}</div></div>`};
V.compare=()=>{const o=(v)=>DB.map(e=>`<option value="${e.id}" ${v==e.id?'selected':''}>${e.id} · ${esc(e.name)}</option>`).join('');const A=DB.find(e=>e.id==S.ca),B=DB.find(e=>e.id==S.cb);
return `<h1>Compare Responses</h1><p class="sub">Enter your own prompt and two responses, or pick two saved evaluations.</p><div class="card" style="margin-bottom:14px"><h2>Compare new responses</h2><label style="margin-top:0">Your prompt *</label><textarea id="c_p" style="min-height:70px"></textarea><div class="grid g2"><div><label>Response A *</label><textarea id="c_a"></textarea></div><div><label>Response B *</label><textarea id="c_b"></textarea></div></div><div class="err" id="c_e"></div><div class="row" style="margin-top:12px"><button class="btn" onclick="cmpNew()">Evaluate &amp; compare</button><span class="sm mu">Demo-mode scoring. Both responses are saved to History.</span></div></div><h2>Or compare saved evaluations</h2><div class="grid g2"><div><select onchange="S.ca=this.value;go()"><option value="">Select response A</option>${o(S.ca)}</select></div><div><select onchange="S.cb=this.value;go()"><option value="">Select response B</option>${o(S.cb)}</select></div></div>${A&&B?`<div class="grid g2" style="margin-top:14px"><div class="card"><h2>A: ${esc(A.name)} ${badge(pct(A))}</h2>${tbl(A,B)}<div class="pre" style="margin-top:10px">${esc(A.response)}</div></div><div class="card"><h2>B: ${esc(B.name)} ${badge(pct(B))}</h2>${tbl(B,A)}<div class="pre" style="margin-top:10px">${esc(B.response)}</div></div></div><div class="card" style="margin-top:14px;text-align:center"><h2>Radar (purple A, amber B)</h2>${radar([DIM.map(k=>A.scores[k]),DIM.map(k=>B.scores[k])])}<p><b>${pct(A)==pct(B)?'Tie':pct(A)>pct(B)?'A scores higher':'B scores higher'}</b> (${pct(A)} vs ${pct(B)})</p></div>`:'<p class="mu" style="margin-top:14px">Select two evaluations.</p>'}`};
function cmpNew(){const g=i=>document.getElementById(i).value.trim(),p=g('c_p'),a=g('c_a'),b=g('c_b'),er=document.getElementById('c_e');if(p.length<5||a.length<20||b.length<20){er.textContent='Enter a prompt (5+ characters) and both responses (20+ characters each).';return}
const mk=(r,t,i)=>{const sc=score(p,r,'',''),e={id:'EV-'+(1001+DB.length+i+Math.floor(Math.random()*900)),name:'Compare '+t+': '+p.slice(0,30),ts:Date.now(),prompt:p,response:r,expected:'',sources:'',scores:sc,mode:'demo',...texts(sc,false)};e.why.factual='Unverified: no reference sources were supplied, so factual accuracy could not be checked.';DB.push(e);return e.id};
S.ca=mk(a,'A',0);S.cb=mk(b,'B',1);save();go();toast('Both responses evaluated and saved')}
const tbl=(a,b)=>DIM.map(k=>{const d=a.scores[k]-b.scores[k];return `<div class="row sp"><span>${LBL[k]}</span><span><b>${a.scores[k]}/10</b> <span class="sm ${d>0?'up':d<0?'dn':'mu'}">${d>0?'+':''}${d}</span></span></div>`}).join('')+`<div class="row sp"><b>Overall</b><b>${pct(a)}/100</b></div>`;
V.reports=()=>{const l=DB,a=l.length?Math.round(l.reduce((s,e)=>s+pct(e),0)/l.length):0;
return `<h1>Reports</h1><p class="sub">Summary of all evaluations.</p><div class="card"><div class="grid g4"><div><span class="mu">Evaluations</span><b style="display:block;font-size:24px">${l.length}</b></div><div><span class="mu">Average score</span><b style="display:block;font-size:24px">${a}/100</b></div>${DIM.slice(0,2).map(k=>`<div><span class="mu">Avg ${LBL[k]}</span><b style="display:block;font-size:24px">${avg(l,k)}/10</b></div>`).join('')}</div><p>${ST.map((s,i)=>`${s[0]}: <b>${l.filter(e=>stIdx(pct(e))==i).length}</b>`).join(' · ')}</p><div class="row noprint"><button class="btn" onclick="csvModal(DB)">Export CSV</button><button class="btn sec" onclick="window.print()">Print / Save as PDF</button></div><p class="sm mu noprint">PDF: use your browser’s print dialog and choose “Save as PDF”. For a single evaluation, open it from History and print from its page.</p></div><div class="card" style="margin-top:14px">${table(l.slice().sort((a,b)=>b.ts-a.ts).slice(0,15),1)}</div>`};
V.settings=()=>`<h1>Settings</h1><p class="sub">Data is stored only in this browser.</p><div class="card" style="max-width:620px"><h2>Evaluation mode</h2><p>Demo mode (deterministic heuristic). Connecting a real AI judge requires a backend with an API key, which a hosted static page cannot hold safely.</p><h2>Data</h2><div class="row"><button class="btn sec" onclick="DB=seed();save();go();toast('Sample data restored')">Reset to sample data</button><button class="btn sec" onclick="modal('<h2>Clear all data?</h2><p class=mu>Removes every evaluation.</p><div class=row><button class=btn onclick=&quot;DB=[];save();closeM();go()&quot;>Clear all</button><button class=&quot;btn sec&quot; onclick=closeM()>Cancel</button></div>')">Clear all evaluations</button></div></div>`;
function nav(v){S.view=v;if(v!='new'&&v!='detail')S.edit=null;go();scrollTo(0,0)}
function go(){document.getElementById('nav').innerHTML=NAV.map(n=>`<button class="${S.view==n[0]||(S.view=='detail'&&n[0]=='history')?'on':''}" onclick="nav('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');
try{document.getElementById('main').innerHTML=V[S.view]()}catch(e){document.getElementById('main').innerHTML='<div class="card"><b>Something went wrong.</b><p class="mu">'+esc(e.message)+'</p></div>'}}
go();
</script></body></html>
